schema_version: 1

context:
  name: cu2qu
  version: 1.6.7.post2

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cu2qu-${{ version }}.zip
  sha256: 1df562d99bd6059226088f443702bf51cfdd8cc63623f23137459a78d7bf5808

build:
  number: 4
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - cu2qu = cu2qu.cli:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
    - setuptools-scm
  run:
    - fonttools >=3.32.0
    - python
    - defcon

tests:
  - python:
      imports:
        - cu2qu
      pip_check: true
  - requirements:
      run:
        - pip
    script:
      - cu2qu --help

about:
  summary: Cubic-to-quadratic bezier curve conversion
  license: Apache-2.0
  license_file:
    - LICENSE
  homepage: https://github.com/googlefonts

extra:
  recipe-maintainers:
    - jan-janssen
